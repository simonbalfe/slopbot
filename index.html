<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenBot</title>
<style>
:root{color-scheme:dark;--bg:#090b0d;--panel:#11151a;--line:#293039;--muted:#8f9ba8;--text:#edf2f7;--accent:#7ce4ae}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #346449;background:#173727;color:#b9f5d5;border-radius:8px;padding:9px 12px}button:disabled{cursor:not-allowed;opacity:.45}.shell{display:grid;grid-template-columns:260px 1fr;height:100vh}.sidebar{border-right:1px solid var(--line);padding:24px 16px;overflow:auto}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand h1{font:650 22px/1 system-ui,sans-serif;letter-spacing:-.04em;margin:0}.agent{width:100%;display:block;text-align:left;background:transparent;color:var(--text);border:1px solid transparent;padding:12px;margin-bottom:6px}.agent.active{background:var(--panel);border-color:var(--line)}.agent-name{display:flex;justify-content:space-between;gap:8px}.role,.status{color:var(--muted);font-size:12px}.status.running{color:#ffd479}.status.error{color:#ff8d8d}.main{min-width:0;display:grid;grid-template-rows:auto 1fr auto}.header{padding:20px 28px;border-bottom:1px solid var(--line)}.header h2{font:600 20px/1.2 system-ui,sans-serif;margin:0 0 5px}.messages{overflow:auto;padding:24px 28px}.message{max-width:780px;margin:0 0 18px}.message.user{margin-left:auto}.label{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.message.user .label{text-align:right;color:var(--muted)}.bubble{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}.message.user .bubble{background:#151b21}.empty{height:100%;display:grid;place-items:center;color:var(--muted)}.composer{display:grid;grid-template-columns:minmax(220px,1fr) auto auto auto auto;gap:10px;padding:18px 28px;border-top:1px solid var(--line)}input,select{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 13px;outline:none}input:focus,select:focus{border-color:var(--accent)}@media(max-width:900px){.composer{grid-template-columns:1fr auto auto}.composer #prompt{grid-column:1/-1}}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{border:0;border-bottom:1px solid var(--line);padding:14px;max-height:190px}.main{min-height:calc(100vh - 190px)}.composer{grid-template-columns:1fr auto;padding:12px}.composer #prompt{grid-column:1/-1}.header,.messages{padding-left:16px;padding-right:16px}}
</style>
</head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><h1>OpenBot</h1><button id="add" aria-label="Add agent">+</button></div><div id="agents"></div></aside><main class="main"><header class="header"><h2 id="name">Starting agents…</h2><div class="role" id="role">One App Server, isolated threads</div></header><section class="messages" id="messages"><div class="empty">Connecting to Codex…</div></section><form class="composer" id="composer"><input id="prompt" autocomplete="off" placeholder="Message this agent" aria-label="Message"><select id="skill" aria-label="Skill"><option value="">No skill</option></select><select id="target" aria-label="Handoff target"></select><button id="send">Send</button><button id="pass" type="button">Pass last reply</button></form></main></div>
<script>
let agents=[],skills=[],selected='';const agentsEl=document.querySelector('#agents'),messages=document.querySelector('#messages'),nameEl=document.querySelector('#name'),roleEl=document.querySelector('#role'),composer=document.querySelector('#composer'),promptEl=document.querySelector('#prompt'),skillEl=document.querySelector('#skill'),target=document.querySelector('#target'),pass=document.querySelector('#pass');
const esc=value=>value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function current(){return agents.find(agent=>agent.id===selected)}
function render(){if(!selected&&agents[0])selected=agents[0].id;const agent=current();agentsEl.innerHTML=agents.map(item=>'<button class="agent '+(item.id===selected?'active':'')+'" data-id="'+item.id+'"><span class="agent-name"><strong>'+esc(item.name)+'</strong><span class="status '+item.status+'">'+item.status+'</span></span><span class="role">'+esc(item.role)+'</span></button>').join('');if(!agent)return;nameEl.textContent=agent.name;roleEl.textContent=agent.role+' · '+agent.sandbox;const nearBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<80;messages.innerHTML=agent.messages.map(message=>'<article class="message '+message.role+'"><div class="label">'+(message.role==='user'?'You / handoff':esc(agent.name))+'</div><div class="bubble">'+esc(message.text)+'</div></article>').join('')||'<div class="empty">Send a task, then pass the reply to another agent.</div>';target.innerHTML=agents.filter(item=>item.id!==agent.id).map(item=>'<option value="'+item.id+'">Pass to '+esc(item.name)+'</option>').join('');pass.disabled=!agent.messages.some(message=>message.role==='assistant')||!target.value;if(nearBottom)messages.scrollTop=messages.scrollHeight}
async function refresh(){const response=await fetch('/api/agents');if(response.ok){agents=await response.json();render()}}
async function refreshSkills(){const selectedSkill=skillEl.value,response=await fetch('/api/skills');if(response.ok){skills=await response.json();skillEl.innerHTML='<option value="">No skill</option>'+skills.map(skill=>'<option value="'+esc(skill.name)+'" title="'+esc(skill.description)+'">$'+esc(skill.name)+'</option>').join('');skillEl.value=selectedSkill}}
agentsEl.addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(button){selected=button.dataset.id;render()}});
composer.addEventListener('submit',async event=>{event.preventDefault();const text=promptEl.value.trim(),agent=current();if(!text||!agent)return;promptEl.value='';await fetch('/api/agents/'+agent.id+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,skill:skillEl.value||null})});await refresh()});
pass.addEventListener('click',async()=>{const agent=current();if(!agent||!target.value)return;await fetch('/api/agents/'+agent.id+'/pass',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({to:target.value})});await refresh()});
document.querySelector('#add').addEventListener('click',async()=>{const name=window.prompt('Agent name');if(!name)return;const role=window.prompt('Agent role');if(!role)return;const response=await fetch('/api/agents',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,role})});if(response.ok){const agent=await response.json();selected=agent.id;await refresh()}});
setInterval(refresh,500);setInterval(refreshSkills,5000);refresh();refreshSkills();
</script></body></html>
