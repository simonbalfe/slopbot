services:
  slopbot:
    build: .
    container_name: slopbot
    init: true
    restart: unless-stopped
    environment:
      PORT: 4317
      SLOPBOT_HOST: 0.0.0.0
      SLOPBOT_WORKSPACE: /workspace
      SLOPBOT_DATA_DIR: /data
      SLOPBOT_COMPUTER_URL: ${SLOPBOT_COMPUTER_URL:-http://host.docker.internal:6080}
      SLOPBOT_COMPUTER_VIEW_URL: ${SLOPBOT_COMPUTER_VIEW_URL:-http://127.0.0.1:6080}
      SLOPBOT_COMPUTER_API_KEY: ${SLOPBOT_COMPUTER_API_KEY:-}
      SLOPBOT_NOUS_CLIENT_ID: ${SLOPBOT_NOUS_CLIENT_ID:-}
    ports:
      - 127.0.0.1:4317:4317
    volumes:
      - ./data/runtime:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:4317/health]
      interval: 5s
      timeout: 3s
      retries: 12
