x-sandbox: &sandbox
  image: ghcr.io/agent-infra/sandbox:1.11.0
  restart: unless-stopped
  entrypoint: ["/bin/sh", "-c"]
  command:
    - "mkdir -p /home/gem/.config/browser && chown -R 1000:1000 /home/gem/.config && rm -f /home/gem/.config/browser/Singleton* && exec /opt/gem/run.sh"
  security_opt:
    - seccomp=unconfined
  shm_size: 2gb
  environment:
    SANDBOX_API_KEY: ${SLOPBOT_SANDBOX_API_KEY:-}
    WORKSPACE: /home/gem/workspace
services:
  sandbox-lead:
    <<: *sandbox
    container_name: slopbot-sandbox-lead
    ports:
      - ${SLOPBOT_BIND_ADDRESS:-127.0.0.1}:6080:8080
    volumes:
      - ${SLOPBOT_WORKSPACE_PATH:-./workspace}:/home/gem/workspace
      - sandbox-lead-profile:/home/gem/.config/browser

  sandbox-worker:
    <<: *sandbox
    container_name: slopbot-sandbox-worker
    ports:
      - ${SLOPBOT_BIND_ADDRESS:-127.0.0.1}:6081:8080
    volumes:
      - ${SLOPBOT_WORKSPACE_PATH:-./workspace}:/home/gem/workspace
      - sandbox-worker-profile:/home/gem/.config/browser

  slopbot:
    build: .
    container_name: slopbot
    depends_on:
      - sandbox-lead
      - sandbox-worker
    init: true
    restart: unless-stopped
    environment:
      PORT: ${PORT:-4317}
      SLOPBOT_HOST: 0.0.0.0
      SLOPBOT_WORKSPACE: /workspace
      SLOPBOT_DATA_DIR: /data
      SLOPBOT_SANDBOX_URLS: http://sandbox-lead:8080,http://sandbox-worker:8080
      SLOPBOT_SANDBOX_PUBLIC_URLS: http://127.0.0.1:6080,http://127.0.0.1:6081
      SLOPBOT_SANDBOX_API_KEY: ${SLOPBOT_SANDBOX_API_KEY:-}
    ports:
      - ${SLOPBOT_BIND_ADDRESS:-127.0.0.1}:${PORT:-4317}:${PORT:-4317}
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./data:/data
      - ${SLOPBOT_WORKSPACE_PATH:-./workspace}:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:${PORT:-4317}/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  sandbox-lead-profile:
  sandbox-worker-profile:
