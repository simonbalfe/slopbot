services:
  slopbot:
    build: .
    container_name: slopbot
    init: true
    restart: unless-stopped
    environment:
      SLOPBOT_HOST: 0.0.0.0
      SLOPBOT_WORKSPACE: /workspace
      SLOPBOT_DATA_DIR: /data
      SLOPBOT_X11_DISPLAY: :99
      SLOPBOT_X11_SCREENS: 2
      SLOPBOT_X11_GEOMETRY: 1920x1080x24
      SLOPBOT_LOCAL_COMPUTER_URL: ${SLOPBOT_LOCAL_COMPUTER_URL:-}
      SLOPBOT_X11_VIEWER_BASE_URL: ${SLOPBOT_X11_VIEWER_BASE_URL:-http://127.0.0.1}
    ports:
      - ${SLOPBOT_BIND_ADDRESS:-127.0.0.1}:4317:4317
      - ${SLOPBOT_BIND_ADDRESS:-127.0.0.1}:6080-6081:6080-6081
    security_opt:
      - seccomp=unconfined
    shm_size: 1gb
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4317/api/agents"]
      interval: 10s
      timeout: 3s
      retries: 6
